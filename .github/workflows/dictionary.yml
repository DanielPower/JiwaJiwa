name: Dictionary

# Rebuilds the dictionary from the pinned sources and checks that the
# committed database matches.
on:
  push:
    paths:
      - tools/dictionary/**
      - app/src/main/assets/databases/dictionary.db
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover tools/dictionary
      - run: python3 tools/dictionary/build_dictionary.py --check
