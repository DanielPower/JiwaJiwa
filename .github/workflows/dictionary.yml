name: Dictionary

# Rebuilds the dictionary from the pinned sources and checks that it matches
# the content digest recorded in build_report.md.
on:
  push:
    paths:
      - tools/dictionary/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}
      - run: python3 -m unittest discover tools/dictionary
      - run: python3 tools/dictionary/build_dictionary.py --check
