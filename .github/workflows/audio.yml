name: Record story audio

# Records the stories' sentences with Fish Audio (tools/stories/voices.json,
# and each of the cast's `fish` voice), only the ones without a clip yet, and
# commits the clips to app/src/main/assets/audio on main. Each new voice is
# measured once, and its gain (tools/stories/levels.json) evens out how loud
# the voices play in the app.
# It's the first job of "Build and release", so each merge ships with its
# clips. Pull requests record nothing, so a story reworked over many pushes
# isn't recorded each time; until it merges, the app reads its new lines in
# the phone's voice.
# Clips are named by a hash of the model, voice and sentence, so a sentence is
# recorded again only when one of those changes, and clips no sentence uses
# any more are deleted. Each recording costs money: a run stops before going
# over $5, unless it's run by hand with a higher limit.

on:
  workflow_call:
    outputs:
      sha:
        description: The commit on main with the clips
        value: ${{ jobs.record.outputs.sha }}
  # Records main, whichever branch it's started on.
  workflow_dispatch:
    inputs:
      limit:
        description: Most to spend, in dollars
        default: "5"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run at a time, so two never record the same sentences.
    concurrency:
      group: audio
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tip of main rather than the commit that started the run, which
          # may be behind clips a later merge's run has already recorded.
          ref: main
          # Main takes no direct pushes, but this deploy key may bypass that.
          # Without it the workflow's own token pushes, which is fine while
          # main isn't protected.
          ssh-key: ${{ secrets.AUDIO_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}

      - name: Build the dictionary
        run: python3 tools/dictionary/build_dictionary.py

      # To level each clip's loudness and compress it.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Record
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: ./gradlew -PcoreOnly=true :core:storyAudio -Precord -Plimit=${{ inputs.limit || '5' }}

      # Even when recording failed or was stopped: what was recorded is paid for.
      - name: Commit the clips
        id: commit
        if: always()
        run: |
          # The assets folder, as audio/ isn't there until something's recorded.
          # The dictionary built into it is ignored. levels.json has each voice's gain.
          git add -A app/src/main/assets tools/stories/levels.json
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The release that started this builds the clips' commit, so pushing
          # it mustn't start another.
          git commit -m "Record story audio [skip ci]"
          # A merge may have landed while it recorded: the clips are new files, so they go on top.
          pushed=false
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 5))
          done
          if [ "$pushed" != true ]; then
            # Kept for two weeks so paid-for clips can still be committed by hand.
            echo "::error::Couldn't push the clips; they're attached to this run."
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Keep the clips if they couldn't be pushed
        if: failure() && steps.commit.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: story-audio
          path: |
            app/src/main/assets/audio
            tools/stories/levels.json
          retention-days: 14
