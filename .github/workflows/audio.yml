name: Record story audio

# Records the stories' sentences with Fish Audio (tools/stories/voices.json,
# and each of the cast's `fish` voice) and uploads the clips to the audio
# bucket (DigitalOcean Spaces), where the app downloads them as chapters open.
# Only sentences without a clip in the bucket are recorded: clips are named by
# a hash of the model, voice and sentence, so a sentence is recorded again
# only when one of those changes. Old clips are left in the bucket, as older
# versions of the app still play them.
# Each new voice is measured once, and its gain (levels.json, kept in the
# bucket) evens out how loud the voices play in the app; builds download it.
# It runs alongside the release, not before it: until a line's clip is
# uploaded, the app reads it in the phone's voice.
# Each recording costs money: a run stops before going over $5, unless it's
# run by hand with a higher limit.
#
# Needs the FISH_API_KEY, SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY
# secrets, and the SPACES_BUCKET and SPACES_REGION variables.

on:
  push:
    branches: [main]
    paths:
      - tools/stories/**
      - core/src/main/kotlin/ca/danielpower/jstudy/core/Recordings.kt
      - .github/workflows/audio.yml
  workflow_dispatch:
    inputs:
      limit:
        description: Most to spend, in dollars
        default: "5"

# One run at a time, so two never record the same sentences.
concurrency:
  group: audio
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
  # Spaces ignores it, but the AWS CLI wants one.
  AWS_DEFAULT_REGION: us-east-1
  ENDPOINT: https://${{ vars.SPACES_REGION }}.digitaloceanspaces.com
  BUCKET: s3://${{ vars.SPACES_BUCKET }}

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}

      - name: Build the dictionary
        run: python3 tools/dictionary/build_dictionary.py

      # To level each clip's loudness and compress it.
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # The first run fills the bucket with the clips and gains that were
      # committed until audio moved there, rather than recording them again.
      - name: Fill an empty bucket
        run: |
          if aws s3 ls "$BUCKET/levels.json" --endpoint-url "$ENDPOINT" > /dev/null; then exit 0; fi
          git fetch --unshallow --quiet origin
          last=$(git rev-list -1 HEAD -- tools/stories/levels.json)
          mkdir -p build/seed
          git --work-tree=build/seed checkout "$last^" -- app/src/main/assets/audio tools/stories/levels.json
          git reset --quiet
          aws s3 sync build/seed/app/src/main/assets/audio "$BUCKET/audio/" --endpoint-url "$ENDPOINT" \
            --acl public-read --content-type audio/ogg --cache-control "public, max-age=31536000, immutable" --only-show-errors
          aws s3 cp build/seed/tools/stories/levels.json "$BUCKET/levels.json" --endpoint-url "$ENDPOINT" \
            --acl public-read --content-type application/json --cache-control "no-cache" --only-show-errors

      - name: List the bucket
        run: |
          mkdir -p build
          aws s3 cp "$BUCKET/levels.json" tools/stories/levels.json --endpoint-url "$ENDPOINT" --only-show-errors
          aws s3 ls "$BUCKET/audio/" --endpoint-url "$ENDPOINT" | awk '{print $4}' | sed -n 's/\.opus$//p' > build/have.txt
          echo "$(wc -l < build/have.txt) clips in the bucket"

      - name: Record
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: ./gradlew -PcoreOnly=true :core:storyAudio -Precord -Plimit=${{ inputs.limit || '5' }} -Phave="$PWD/build/have.txt"

      # Even when recording failed or was stopped: what was recorded is paid for.
      # Clips never change, so phones and the CDN can keep them for good.
      - name: Upload the clips
        if: always()
        run: |
          if [ -d build/audio ]; then
            aws s3 sync build/audio "$BUCKET/audio/" --endpoint-url "$ENDPOINT" --exclude "*" --include "*.opus" \
              --acl public-read --content-type audio/ogg --cache-control "public, max-age=31536000, immutable" --only-show-errors
            echo "Uploaded $(find build/audio -name '*.opus' | wc -l) clips"
          fi
          if [ -f tools/stories/levels.json ]; then
            aws s3 cp tools/stories/levels.json "$BUCKET/levels.json" --endpoint-url "$ENDPOINT" \
              --acl public-read --content-type application/json --cache-control "no-cache" --only-show-errors
          fi
