name: Check pull request

# Builds a pull request the way a release would, without publishing
# anything. The debug APK is attached to the run so it can be tried, and a
# comment on the pull request links to it. Unit tests run separately, in
# test.yml. It can also be run by hand on any branch, from the Actions tab.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Where the app downloads the stories' recordings from (see audio.yml); empty without the bucket set up.
      AUDIO_URL: ${{ vars.SPACES_BUCKET && format('https://{0}.{1}.cdn.digitaloceanspaces.com', vars.SPACES_BUCKET, vars.SPACES_REGION) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}

      - name: Build the dictionary
        run: |
          python3 tools/dictionary/build_dictionary.py
          git diff --exit-code tools/dictionary/build_report.md

      # Each recorded voice's gain, kept in the audio bucket by audio.yml. Without
      # it every voice plays as recorded.
      - name: Get the voices' gains
        run: |
          curl -fsSL "https://${{ vars.SPACES_BUCKET }}.${{ vars.SPACES_REGION }}.digitaloceanspaces.com/levels.json" -o tools/stories/levels.json \
            || { rm -f tools/stories/levels.json; echo "::warning::Couldn't get levels.json from the audio bucket; voices play without their gains."; }

      # The core tests in test.yml run without the dictionary, which skips
      # StoryPathTest; here it's built, so the stories are checked before merging.
      - name: Check the stories
        run: ./gradlew :core:test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-check-report
          path: |
            core/build/reports/tests/test
            core/build/reports/story-path.txt
          retention-days: 14

      # The release build runs the same checks as a real release. The debug
      # build has its own app id, so it installs next to the release app.
      - name: Build
        run: ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleDebug

      # The stories aren't committed: the build writes them, so check they made it in.
      - name: Check the stories are bundled
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk.txt
          grep -q "assets/stories/path.json" apk.txt
          grep -q "assets/stories/needs.json" apk.txt
          grep -q "assets/stories/read/arrival.json" apk.txt

      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: jiwajiwa-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # One comment per pull request, updated on each push, so the latest
      # APK is a tap away on a phone. Pull requests from forks can't comment.
      - name: Link the APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          APK_URL: ${{ steps.apk.outputs.artifact-url }}
        with:
          script: |
            const marker = "<!-- debug-apk -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Debug APK** for ${sha}: [download](${process.env.APK_URL}) (a zip with the APK inside; kept for 14 days).\n\nIt installs next to the real app as "Jiwa Jiwa Debug".`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.user.type === "Bot" && c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
