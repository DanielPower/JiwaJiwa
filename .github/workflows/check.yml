name: Check pull request

# Builds a pull request the way a release would, without publishing
# anything. The APK is attached to the run so it can be tried. Unit tests
# run separately, in test.yml.

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}

      - name: Build the dictionary
        run: |
          python3 tools/dictionary/build_dictionary.py
          git diff --exit-code tools/dictionary/build_report.md

      # The release build runs the same checks as a real release. The debug
      # build has its own app id, so it installs next to the release app.
      - name: Build
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jstudy-pr-${{ github.event.pull_request.number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
