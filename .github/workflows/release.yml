name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the dictionary build
        run: python3 -m unittest discover tools/dictionary

      - uses: actions/cache@v4
        with:
          path: tools/dictionary/.cache
          key: dictionary-sources-${{ hashFiles('tools/dictionary/sources.json') }}

      # The database isn't committed (it holds all of JMdict). Building it also
      # rewrites build_report.md, which must come out unchanged.
      - name: Build the dictionary
        run: |
          python3 tools/dictionary/build_dictionary.py
          git diff --exit-code tools/dictionary/build_report.md

      # The tests also run in test.yml; running them here keeps a failing
      # build from being published.
      - name: Test and build
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :core:test :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          apk="jiwajiwa-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The bundle is what Google Play takes; the APK is for installing directly.
          cp app/build/outputs/bundle/release/app-release.aab "jiwajiwa-${version}.aab"
          notes="$(git log -1 --pretty=%B)"
          if [ "$SIGNED" != "true" ]; then
            notes="${notes}"$'\n\n'"Signed with a temporary debug key. Add the signing secrets (see Release signing in the README) so updates install over each other."
          fi
          gh release create "v${version}" "$apk" "jiwajiwa-${version}.aab" --title "Jiwa Jiwa ${version}" --notes "$notes" --target "$GITHUB_SHA"

      # Sends each release to Google Play's internal testing track, once the
      # PLAY_SERVICE_ACCOUNT_JSON secret is set (see "Google Play" in the README).
      # Play's "What's new" text is the commit message, cut to its 500-character limit.
      - name: Write Play release notes
        if: env.PLAY_UPLOAD == 'true'
        run: |
          mkdir -p whatsnew
          git log -1 --pretty=%B | head -c 500 > whatsnew/whatsnew-en-US

      - name: Upload to Google Play internal testing
        if: env.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.crispyumbrella.jiwajiwa
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: whatsnew
